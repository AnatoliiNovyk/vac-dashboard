<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Dashboard - Вхід</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="header-title">
                    <i class="fas fa-calendar-alt"></i>
                    Vacation Dashboard
                </h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Login Screen -->
            <div id="login-screen" class="welcome-screen">
                <div class="welcome-card">
                    <i class="fas fa-id-card welcome-icon"></i>
                    <h2>Вхід до системи</h2>
                    <p>Будь ласка, введіть ваш ідентифікаційний номер (ІПН), щоб увійти.</p>
                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label for="tax-id-input" class="form-label sr-only">Ідентифікаційний номер (ІПН)</label>
                            <input type="text" id="tax-id-input" class="form-control" placeholder="Ваш ІПН" required autocomplete="off">
                        </div>
                        <button type="submit" id="login-btn" class="btn btn--primary btn--full-width">
                            <i class="fas fa-sign-in-alt"></i>
                            Увійти
                        </button>
                        <div id="login-error" class="form-error hidden"></div>
                    </form>
                </div>
            </div>

            <!-- Dashboard Container (initially hidden) -->
            <div id="dashboard-container" class="dashboard-container hidden">
                <!-- User Info Bar -->
                <div class="user-info-bar">
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="current-user-name">Користувач</span>
                        <span id="current-user-role" class="user-role-badge">Роль</span>
                    </div>
                    <div class="user-stats stats-grid" id="stats-grid">
                        <!-- Cards for stats will be rendered here -->
                    </div>
                </div>
                <!-- Tabs Navigation -->
                <nav id="tabs-nav" class="tabs-nav"></nav>
                <!-- Filters Section -->
                <section class="filters-section" id="filters-section">
                    <div class="filters-grid" id="filters-grid">
                        <!-- Filter controls will be rendered here -->
                    </div>
                </section>
                <!-- Content Area: Calendar + Table -->
                <div class="content-area">
                    <!-- Calendar Section -->
                    <section class="calendar-section" id="calendar-section">
                        <div class="calendar-header">
                            <h3>Календар відпусток</h3>
                            <div class="calendar-controls" id="calendar-controls"></div>
                        </div>
                        <div id="vacation-calendar"></div>
                        <div class="calendar-legend" id="calendar-legend"></div>
                    </section>
                    <!-- Table Section -->
                    <section class="table-section" id="table-section">
                        <div class="table-header">
                            <h3 id="table-title">Таблиця співробітників</h3>
                        </div>
                        <div class="table-container">
                            <table class="vacations-table" id="vacations-table">
                                <thead id="table-head"></thead>
                                <tbody id="table-body"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <!-- Tab Content (legacy, for compatibility) -->
                <div id="tab-content" class="tab-content" style="display:none;"></div>
                <!-- Role Test Button -->
                <button id="role-test-btn" class="btn btn--secondary mt-16">Тест ролі</button>
            </div>
        </div>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-functions-compat.js"></script>

    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <script src="app.js"></script>
</body>
</html>
